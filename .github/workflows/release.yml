# Tag v* to release. Images are not in git: they live on the "assets"
# pre-release and are re-attached to every version, which install.sh relies on.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build
        run: |
          gh release download assets --pattern assets.tar.xz
          git archive --format=tar --prefix=neZha-Hyprlock-Theme/ "$TAG" | xz -9 > source.tar.xz
          sha256sum assets.tar.xz source.tar.xz > SHA256SUMS

      - name: Write notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            echo "## Changes"
            git log --no-merges --format='- %s' "${prev:+$prev..}$TAG"
            echo
            echo "## Install"
            echo '```sh'
            echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash'
            echo '```'
            echo
            echo "## Checksums"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md

      - name: Publish
        run: |
          gh release create "$TAG" assets.tar.xz source.tar.xz SHA256SUMS \
            --title "neZha Hyprlock Theme $TAG" --notes-file notes.md --verify-tag
